{% extends 'base.html' %}
{% block content %}<h1>{{ '社員更新' if employee else '社員追加' }}</h1>
<form action="{{ '/employee/update' if employee else '/employee/save' }}" method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
{% if employee %}<input type="hidden" name="id" value="{{ employee.id }}"><p>社員ID: {{ employee.id }}</p>{% endif %}
<table class="form_table"><tr><td>名前:</td><td><input name="name" value="{{ values.get('name','') }}" required maxlength="50"></td></tr>
<tr><td>アイコン:</td><td>{% if employee and employee.photo %}<img class="photo" src="/uploads/{{ employee.photo }}" alt="現在の写真"><br>{% endif %}<input type="file" name="img" accept="image/png,image/jpeg,image/gif"><p class="hint">PNG/JPEG/GIF、5MB以下。未選択なら現在の写真を保持します。</p></td></tr>
<tr><td>給料:</td><td><input name="salary" value="{{ values.get('salary','') }}" type="number" min="0" max="9999999999.99" step="0.01" required></td></tr>
<tr><td>誕生日:</td><td><input name="birthday" value="{{ values.get('birthday','') }}" type="date" required></td></tr></table>
<p><button class="button" type="submit">提出する</button> <a href="/employee/lists">一覧へ戻る</a></p></form>
{% endblock %}
